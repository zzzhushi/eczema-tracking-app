name: eXzema
options:
  bundleIdPrefix: com.zzzhushi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  eXzema:
    type: application
    platform: iOS
    sources:
      - path: eXzema
    info:
      path: eXzema/Info.plist
      properties:
        CFBundleDisplayName: eXzema
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: eXzema uses the camera to scan ingredient labels and barcodes. Scans are processed entirely on this device and never uploaded.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzhushi.eXzema
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
  eXzemaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: eXzemaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: eXzema
schemes:
  eXzema:
    build:
      targets:
        eXzema: all
        eXzemaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - eXzemaTests
