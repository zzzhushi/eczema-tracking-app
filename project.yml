name: eXzema
options:
  preGenCommand: mkdir -p App/Generated && [ -f App/Generated/BuildStamp.swift ] || echo 'enum BuildStamp { static let value = "" }' > App/Generated/BuildStamp.swift
  bundleIdPrefix: com.zzzhushi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
packages:
  ExzemaCore:
    path: Packages/ExzemaCore
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  eXzema:
    type: application
    platform: iOS
    sources:
      - App
      - path: data/catalog
        type: folder
        buildPhase: resources
      - path: data/sources.json
        buildPhase: resources
    dependencies:
      - package: ExzemaCore
    preBuildScripts:
      - name: Stamp the build time
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${SRCROOT}/App/Generated"
          printf 'enum BuildStamp { static let value = "%s" }\n' "$(date +%Y%m%d%H%M%S)" > "${SRCROOT}/App/Generated/BuildStamp.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzzhushi.exzema
        PRODUCT_NAME: eXzema
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: eXzema
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: eXzema notes your approximate location, rounded to about 11 km, to show the city and later to look up weather and air quality for each day.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
